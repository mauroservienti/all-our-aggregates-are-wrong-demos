name: Add to project board

on:
  issues:
    types: [opened, reopened, transferred]
  # pull_request_target (not pull_request) so PRs from forks can read the secret.
  # Safe here: this workflow never checks out or runs the PR's code.
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/mauroservienti/projects/3
          github-token: ${{ secrets.PROJECT_TOKEN }}
